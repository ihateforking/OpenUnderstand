name: OpenUnderstand CI

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Create report directory
        run: mkdir -p reports

      - name: Run unit tests and collect coverage
        run: >-
          python -m pytest tests -q
          --junitxml=reports/junit.xml
          --cov=openunderstand
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/htmlcov

      - name: Verify curated Pynguin tests
        run: python -m pytest tests/test_pynguin_models.py -q

      - name: Enforce line coverage gate
        run: python -m coverage report --fail-under=80

      - name: Enforce branch coverage gate
        run: |
          python -m coverage json -o reports/coverage.json
          python - <<'PY'
          import json
          import sys

          with open("reports/coverage.json", encoding="utf-8") as stream:
              totals = json.load(stream)["totals"]

          branch_rate = totals["percent_covered_branches"]
          print(f"Branch coverage: {branch_rate:.2f}%")
          if branch_rate < 70.0:
              print("Branch coverage gate failed: minimum is 70%.", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
