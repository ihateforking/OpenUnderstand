[tool.pytest.ini_options]
testpaths = [
    "test_analysis",
    "test_analysis_G6",
    "test_analysis_G9",
    "test_metrics",
]
pythonpath = ["openunderstand"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["openunderstand"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
